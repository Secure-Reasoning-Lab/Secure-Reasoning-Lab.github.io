  <path d="M202 212 L229 155" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M310 212 L283 155" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 270 L310 212" fill="none" stroke="#1ad0bd" stroke-width="6" stroke-linecap="round"/>
  <path d="M310 212 L337 155" fill="none" stroke="#1ad0bd" stroke-width="6" stroke-linecap="round"/>

